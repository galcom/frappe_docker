# dfp_external_storage: the S3/MinIO provider nginx streams objects from.
#
# HTTP-LEVEL: `upstream` is only valid in the http context, so this must end up in
# /etc/nginx/conf.d/ (auto-included by nginx.conf) -- never in /etc/nginx/dfp/, which is
# included from inside the server block. Baked images ship it at
# /templates/nginx/dfp/http/ and nginx-entrypoint.sh renders it, substituting
# ${DFP_S3_BACKEND}; it can equally be mounted with a literal endpoint.
upstream dfp_s3_backend {
	server ${DFP_S3_BACKEND} fail_timeout=0;
	keepalive 8;
}
