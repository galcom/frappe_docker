# dfp_external_storage: target of the X-Accel-Redirect issued for /file/<id>/<name>.
#
# SERVER-LEVEL: lands in /etc/nginx/dfp/, pulled in by a single `include` line inside
# frappe_docker's server block. Baked images ship it at /templates/nginx/dfp/server/ and
# nginx-entrypoint.sh renders it. Reachable only from that header, never from a client.
location /dfp-s3-internal/ {
	internal;

	# Must match the endpoint the presigned URL was signed for, byte for byte.
	proxy_set_header Host ${DFP_S3_BACKEND};

	# The presigned query string is the credential: an Authorization header would take
	# precedence over it, and the desk cookie has no business going to S3.
	proxy_set_header Authorization "";
	proxy_set_header Cookie "";

	proxy_http_version 1.1;
	proxy_set_header Connection "";

	# Stream through rather than spooling a multi-GB body to disk first.
	proxy_buffering off;
	proxy_request_buffering off;
	proxy_max_temp_file_size 0;

	# Per-read, not total: a slow client is not a stalled upstream.
	proxy_connect_timeout 15s;
	proxy_read_timeout 300s;
	proxy_send_timeout 300s;

	proxy_hide_header x-amz-id-2;
	proxy_hide_header x-amz-request-id;

	# The trailing slash strips this prefix, leaving /<bucket>/<key>.
	proxy_pass http://dfp_s3_backend/;
}
